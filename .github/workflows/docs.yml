name: Docs

# Builds the docs site as static files and publishes them to https://zupy-ui.github.io
# by pushing the build into the zupy-ui/zupy-ui.github.io repo (GitHub only serves the
# org root from a repo with that name). Runs when the site or any package it renders changes.
on:
  push:
    branches: [main]
    paths:
      - "apps/www/**"
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@zupy/www
      # SITE_DEPLOY_KEY is the private half of a write deploy key on zupy-ui.github.io.
      # Adds .nojekyll, so folders like __tsr/ are served as-is.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: zupy-ui/zupy-ui.github.io
          publish_branch: main
          publish_dir: apps/www/.output/public
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: "deploy: ${{ github.sha }}"
